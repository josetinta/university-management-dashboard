<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard de Gestão Universitária · José Tinta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--navy:#0b4f4a;--navy2:#0f766e;--blue:#14b8a6;--sky:#99e0d6;--pale:#e3f6f2;--gold:#f7b947;--red:#ef6a4c;--green:#0d9488;--ink:#06302d;--muted:#5f7c78;--line:#d3ebe6;--font:'Inter',Segoe UI,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000}html,body{height:100%;overflow:hidden}
body{font-family:var(--font);color:#f3f4f6;font-size:11px;-webkit-font-smoothing:antialiased;background:#000}
button,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}a{color:inherit;text-decoration:none}svg{display:block}
.wrap{position:absolute;left:0;top:0;width:1700px;height:940px;transform-origin:0 0;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.panel{background:#fff;border-radius:18px;box-shadow:0 18px 34px -20px rgba(0,0,0,.6);min-height:0;overflow:hidden;position:relative}
.band{font-size:12.5px;font-weight:800;color:var(--navy);padding:9px 14px 2px;flex:0 0 auto;display:flex;align-items:center;gap:7px}
.band::before{content:"";width:6px;height:15px;border-radius:3px;background:linear-gradient(var(--gold),var(--red))}
.ptl{font-size:10px;font-weight:700;color:var(--muted);text-align:center;padding:4px 6px 0;flex:0 0 auto}
.col{display:flex;flex-direction:column;min-height:0}.fill{flex:1;min-height:0}
/* topo */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;padding:8px 16px;flex:0 0 auto;border-radius:20px;color:#fff;background:#111;border:1px solid #2a2a2a;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:12px}
.brand .mk{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#ef6a4c);color:#06302d;display:grid;place-items:center;font-weight:800;font-size:13px}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;display:block;line-height:1.05}
.brand span{display:block;font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#9fe3d9}
.sp{flex:1}
.plinks{display:flex;gap:5px;flex-wrap:nowrap}
.plinks a{display:flex;align-items:center;gap:5px;padding:6px 10px;white-space:nowrap;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:10.5px;font-weight:600}
.plinks a:hover{background:var(--gold);color:#06302d}.plinks svg{width:12px;height:12px}
.langbar{display:flex;gap:3px;padding:3px;border-radius:999px;background:rgba(255,255,255,.12)}
.langbar button{padding:5px 11px;border-radius:999px;font-size:10px;font-weight:700;color:#cdeee9}.langbar button.on{background:#fff;color:var(--navy)}
.tb{display:flex;gap:5px}.tb button{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}.tb button:hover{background:var(--gold);color:#06302d}.tb svg{width:15px;height:15px}
.who{display:flex;align-items:center;gap:9px}.who img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:2px solid var(--gold)}
.who b{display:block;font-size:12px;font-weight:700}.who span{display:block;font-size:9.5px;color:#a9e6dd}
/* hero */
.hero{display:flex;gap:10px;align-items:stretch;flex:0 0 auto}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;flex:1}
.ik{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#fff;border-radius:18px}
.ik:nth-child(1){background:linear-gradient(135deg,#0f766e,#14b8a6)}.ik:nth-child(2){background:linear-gradient(135deg,#0b4f4a,#0f766e)}.ik:nth-child(3){background:linear-gradient(135deg,#f7b947,#e9962a);color:#06302d}
.ik:nth-child(4){background:linear-gradient(135deg,#14b8a6,#5fd0c0);color:#06302d}.ik:nth-child(5){background:linear-gradient(135deg,#ef6a4c,#f7945c)}.ik:nth-child(6){background:linear-gradient(135deg,#134e4a,#0b4f4a)}
.ik .ic{width:34px;height:34px;flex:0 0 auto;padding:7px;border-radius:11px;background:rgba(255,255,255,.22)}.ik .ic svg{width:100%;height:100%}
.ik b{display:block;font-family:var(--font);font-size:22px;font-weight:800;line-height:1;white-space:nowrap}.ik span{display:block;font-size:10px;font-weight:700;opacity:.9;margin-top:2px}
.dl{font-size:9px;font-weight:800;margin-left:4px}.dl.up{color:var(--green)}.dl.dn{color:var(--red)}.ik .dl{color:inherit}
.filt{min-width:250px;display:flex;flex-direction:column;justify-content:center;gap:6px;flex:0 0 auto;padding:8px 12px;border-radius:18px;background:#111;border:1px solid #2a2a2a}
.filt select{padding:6px 10px;border:0;border-radius:10px;background:#fff;font-weight:700;font-size:11px;color:var(--navy)}
.tabs{display:flex;gap:2px;padding:2px;background:rgba(255,255,255,.14);border-radius:10px}.tabs button{padding:5px 11px;border-radius:8px;font-size:10px;font-weight:700;color:#d6f3ee}.tabs button.on{background:var(--gold);color:#06302d}
/* rows */
.r3{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.2fr);gap:10px;flex:1.15 1 0;min-height:0}
.r4{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.2fr);gap:10px;flex:1.1 1 0;min-height:0}
.r5{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);gap:10px;flex:.9 1 0;min-height:0}
.foot{flex:0 0 auto;text-align:center;font-size:10px;color:#9fd4cc}
/* kpis */
.kb{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px;min-height:0;flex:1}
.eff{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 14px 6px}.eff .t{font-size:10px;font-weight:700;color:var(--muted)}
.seg{position:relative;height:16px;display:flex;margin-top:15px}.seg i:first-of-type{border-radius:8px 0 0 8px}.seg i:last-of-type{border-radius:0 8px 8px 0}.seg i{display:block;height:100%}
.seg .mk{position:absolute;top:-14px;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--ink)}.seg .mk::after{content:"";display:block;width:3px;height:28px;background:var(--red);margin:0 auto;border-radius:2px}
.seg .lb{position:absolute;top:2px;font-size:8px;font-weight:700;color:#fff}
.kg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;flex:1;min-height:0}
.k{border-radius:14px;background:linear-gradient(180deg,#f2fbf9,#e3f6f2);border:1px solid var(--line);padding:7px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3px;min-height:0}
.k .h{font-size:9.5px;font-weight:700;color:var(--muted);line-height:1.15;min-height:22px;display:flex;align-items:center}
.k .v{font-size:19px;font-weight:800;color:var(--navy);line-height:1}
.k .tp{display:grid;grid-template-columns:1fr 1fr;gap:2px 4px;width:100%}.k .tp em{font-style:normal;font-size:8px;font-weight:700;color:var(--muted);text-align:center}
.k .tp b{font-size:9px;font-weight:800;color:var(--ink);text-align:center}.k .tp b.up::before{content:"▲ ";color:var(--green)}.k .tp b.dn::before{content:"▼ ";color:var(--red)}
/* dept */
.dept{padding:0;display:flex;flex-direction:column}
.dept .hd,.dept .r{display:grid;grid-template-columns:1fr 38px 38px 42px 70px;gap:4px;align-items:center;padding:0 12px}
.dept .hd{font-size:9px;font-weight:700;color:var(--muted);text-align:right;padding-top:3px;padding-bottom:3px}.dept .hd span:first-child{text-align:left}
.dept .body{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:6px}
.dept .r{flex:1;font-size:10px;font-weight:600;border-top:1px solid #e8f3f0;text-align:right;min-height:0}.dept .r span:first-child{text-align:left;font-weight:700;color:var(--navy)}
.dept .r.tot{font-weight:800;background:var(--pale)}.dept .r .neg{color:var(--red)}
.dv{position:relative;height:9px}.dv::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#b9d3ce}.dv i{position:absolute;top:0;height:100%;border-radius:5px}
/* charts */
.chart{display:flex;flex-direction:column}.chart .cb{flex:1;min-height:0;padding:2px 10px 8px}.chart svg{width:100%;height:100%}
.sparks{display:flex;flex-direction:column;padding:2px 12px 8px}.sparks .r{flex:1;min-height:0;display:grid;grid-template-columns:64px 1fr;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--navy)}.sparks svg{width:100%;height:100%}
.q4{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;padding:0 12px 8px}.q4 .c{overflow:hidden;display:flex;flex-direction:column;min-height:0;border-radius:12px;background:#f4fbf9}.q4 .c .cb{flex:1;min-height:0}.q4 .c svg{width:100%;height:100%}
.sat .top,.sat .bot{flex:1;min-height:0;display:grid;gap:8px;padding:6px 12px}.sat .top{grid-template-columns:84px 1fr 1fr}.sat .bot{grid-template-columns:84px 1fr}
.gbox{border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:700;padding:8px;line-height:1.25}
.gbox.g{background:linear-gradient(160deg,#2f9d93,#0b4f4a)}.gbox.b{background:linear-gradient(160deg,#f7b947,#ef6a4c);color:#06302d}
.dn2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0}.dn2 svg{flex:1;min-height:0;width:100%}.dn2 span{font-size:9.5px;font-weight:700;color:var(--muted);text-align:center}
.cyls{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;min-height:0}.cyl{display:flex;flex-direction:column;align-items:center;min-height:0}.cyl svg{flex:1;min-height:0;width:100%}.cyl span{font-size:9.5px;font-weight:700;color:var(--muted)}
.pay .r1{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:6px 12px}
.pm{border-radius:14px;padding:6px 8px;text-align:center;position:relative;background:#f2fbf9;border:1px solid var(--line)}
.pm .cy{font-family:var(--font);font-size:18px;font-weight:800;color:var(--navy);line-height:1.1}.pm .cy small{font-family:var(--font);font-size:8.5px;font-weight:700;color:var(--muted);margin-right:3px}
.pm .py{font-size:9px;font-weight:600;color:var(--muted)}.pm .lb{font-size:9px;font-weight:700;color:var(--navy);margin-top:1px}
.stamp{position:absolute;right:-4px;top:-6px;transform:rotate(-8deg);background:#fff;border:1.5px solid var(--red);color:var(--red);font-size:7px;font-weight:800;padding:0 4px;border-radius:3px;letter-spacing:.3px}
.meth{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 12px 10px}
.mt{display:flex;align-items:center;gap:6px;border-radius:12px;padding:6px 7px;background:#f2fbf9;border:1px solid var(--line)}.mt svg{width:22px;height:22px;color:var(--navy2);flex:0 0 auto}
.mt b{display:block;font-size:13px;font-weight:800;color:var(--navy);line-height:1.1}.mt span{display:block;font-size:8.5px;font-weight:600;color:var(--muted)}
.staff{flex:1;min-height:0;display:flex;align-items:center;gap:8px;padding:4px 14px 8px}.ppl{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-around;height:100%}
.ppl .row{display:flex;align-items:center;gap:6px;min-height:0;flex:1}.ppl svg{flex:1;min-height:0;height:100%;width:100%}.ppl b{font-size:14px;font-weight:800;color:var(--navy);width:34px}
.brace{flex:0 0 22px;height:100%}.big73{font-family:var(--font);font-size:34px;font-weight:800;color:var(--navy);flex:0 0 auto}
.los{padding:0 14px 10px}.lrow{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;font-size:9.5px;font-weight:700;color:var(--muted);flex:1;min-height:0}
.lrow div{height:68%;border-radius:8px;color:#fff;font-weight:800;font-size:9.5px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;min-width:22px}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:6px 10px 10px}.fb{border-radius:14px;color:#fff;text-align:center;padding:8px 4px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.fb .n{font-size:9.5px;font-weight:700;line-height:1.15}.fb .v{font-family:var(--font);font-size:18px;font-weight:800}.fb .s{font-size:7.5px;font-weight:600;opacity:.85}
.tr{padding:4px 14px 2px;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3px}.tr .t{font-size:10px;font-weight:700;color:var(--muted)}
.bul{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.bar{position:relative;height:18px;background:var(--pale);border-radius:9px}
.bar .a{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#0b4f4a,#14b8a6);border-radius:9px 0 0 9px;color:#fff;font-size:8.5px;font-weight:700;display:flex;align-items:center;padding-left:6px}
.bar .b{position:absolute;top:0;bottom:0;background:var(--sky)}.bar .tg{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--gold)}
.bul .val{font-size:12px;font-weight:800;color:var(--navy);text-align:right;line-height:1.1}.bul .val small{display:block;font-size:8.5px;color:var(--muted);font-weight:600}
.gz{display:flex;flex-direction:column;align-items:center;min-height:0;flex:1}.gz svg{flex:1;min-height:0;width:100%}.gz b{font-family:var(--font);font-size:18px;font-weight:800;color:var(--navy)}.gz span{font-size:9px;font-weight:700;color:var(--muted)}
/* modal */
#tbl{position:fixed;inset:0;background:rgba(2,20,18,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}#tbl.show{display:flex}
#sheet{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)}
#sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--pale);flex-wrap:wrap}#sheet .sh b{font-family:'Playfair Display',serif;font-size:16px;color:var(--navy);flex:1}#sheet .sh span{font-size:10px;color:var(--muted)}
#sheet .sh button{padding:6px 12px;border-radius:999px;border:1px solid var(--sky);background:#fff;font-size:10.5px;font-weight:700;color:var(--navy)}#sheet .sh button:hover{background:var(--gold)}
.shw{overflow:auto}#shTab{width:100%;border-collapse:collapse;font-size:12px}#shTab th{text-align:right;padding:8px 12px;color:var(--muted);font-size:10.5px;background:#f6fbfa;position:sticky;top:0}#shTab th:first-child,#shTab td:first-child{text-align:left}
#shTab td{padding:8px 12px;border-top:1px solid #e8f3f0;text-align:right;font-weight:600}#shTab td[contenteditable]{outline:0;cursor:text}#shTab td[contenteditable]:focus{background:#fff6dc}

/* ===== tema preto profissional ===== */
:root{--ink:#f3f4f6;--muted:#9ca3af;--navy:#e5e7eb;--line:#27272a;--pale:#1c1c1f;--acc:#2dd4bf}
.panel{background:#111113;border:1px solid #232326;box-shadow:none}
.band{color:#f3f4f6}.band::before{background:var(--acc)}
.topbar,.filt{background:#0b0b0c;border:1px solid #232326}
.brand .mk{background:var(--acc);color:#04201e}
.ik,.ik:nth-child(n){background:#111113!important;color:#f3f4f6!important;border:1px solid #232326}
.ik .ic{background:rgba(45,212,191,.14);color:var(--acc)}
.ik span{color:#9ca3af;opacity:1}.ik b{color:#fff}.ik .dl{color:inherit}
.dl.up{color:#34d399}.dl.dn{color:#f87171}
.k,.pm,.mt,.q4 .c{background:#18181b;border:1px solid #27272a}
.k .v,.pm .cy,.mt b,.big73,.gz b,.ppl b,.bul .val,.dept .r span:first-child,.sparks .r{color:#f3f4f6}
.k .h,.k .tp em,.pm .py,.pm .lb,.mt span,.ptl,.eff .t,.dn2 span,.cyl span,.lrow,.tr .t,.gz span,.bul .val small,.dept .hd,.k .tp b{color:#9ca3af}
.k .tp b{color:#e5e7eb}.pm .cy small{color:#9ca3af}
.dept .r{border-top:1px solid #1f1f23;color:#e5e7eb}.dept .r.tot{background:#18181b}
.dv::before{background:#3f3f46}
.mt svg{color:var(--acc)}
.seg .mk{color:#fff}
.seg i:nth-of-type(1){background:#134e4a!important}.seg i:nth-of-type(2){background:#0f766e!important}.seg i:nth-of-type(3){background:#14b8a6!important}.seg i:nth-of-type(4){background:#27272a!important}
.seg .lb{color:#fff!important}
.gbox.g,.gbox.b{background:#18181b;border:1px solid #27272a;color:#e5e7eb}

.fb .v{color:var(--acc)}.fb:nth-child(3) .v{color:#f7b947}.fb .s{opacity:.7}
.bar{background:#27272a}.bar .b{background:#134e4a}
.lrow div{color:#fff}
.q4 .c svg text[fill]{font-weight:700}
.stamp{background:#111113}
.filt select{background:#18181b;color:#f3f4f6;border:1px solid #27272a}
.tabs{background:#18181b}.tabs button{color:#d1d5db}.tabs button.on{background:var(--acc);color:#04201e}
.langbar{background:#18181b}.langbar button{color:#d1d5db}.langbar button.on{background:#fff;color:#111}
.tb button{background:#18181b;color:#e5e7eb}.tb button:hover,.plinks a:hover{background:var(--acc);color:#04201e}
.plinks a{background:#18181b;border:1px solid #27272a;color:#e5e7eb}
.who img{border-color:var(--acc)}.who span{color:#9ca3af}.brand span{color:#9ca3af}
.foot{color:#6b7280}
#sheet{background:#111113;color:#f3f4f6;border:1px solid #27272a}#sheet .sh{background:#18181b}#sheet .sh b{color:#fff}#sheet .sh button{background:#18181b;color:#e5e7eb;border-color:#3f3f46}#sheet .sh button:hover{background:var(--acc);color:#04201e}
#shTab th{background:#18181b;color:#9ca3af}#shTab td{border-top:1px solid #27272a}#shTab td[contenteditable]:focus{background:#1f2a28}
/* svg */
svg [fill="#0b4f4a"]{fill:#2dd4bf}svg text[fill="#0b4f4a"],svg text[fill="#5f7c78"],svg text[fill="#06302d"]{fill:#d1d5db}
svg [stroke="#0b4f4a"]{stroke:#9ca3af}
svg [stroke="#e7f1ee"],svg [stroke="#dfece9"],svg [stroke="#cfe3df"]{stroke:#27272a}
svg [stroke="#c4ebe4"]{stroke:#3f3f46}svg [fill="#c4ebe4"]{fill:#3f3f46}

<script>
/* =========================================================

function smooth(pts){
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

    :`<g transform="translate(${x},0)"><circle cx="8" cy="5" r="4.2" fill="${fill}"/><path d="M2 12h12v12H2z" rx="2" fill="${fill}"/><rect x="2.5" y="24" width="4.6" height="10" fill="${fill}"/><rect x="8.9" y="24" width="4.6" height="10" fill="${fill}"/></g>`;

function people(pct,fem){

function gaugeSeg(v){
  const cx=110,cy=100,R=88,r=54,n=8;
  const cols=['#8f3a2c','#c1503a','#e8825a','#f2b485','#bfeee6','#5fd0c0','#2bb5a5','#0f766e'];
  const P=(a,rad)=>{const q=a*Math.PI/180;return [cx+rad*Math.cos(q),cy-rad*Math.sin(q)]};
  let s='';
  for(let i=0;i<n;i++){
    const a1=180-i*(180/n), a2=180-(i+1)*(180/n);
    const [x1,y1]=P(a1,R),[x2,y2]=P(a2,R),[x3,y3]=P(a2,r),[x4,y4]=P(a1,r);
    s+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${x3.toFixed(1)} ${y3.toFixed(1)} A${r} ${r} 0 0 0 ${x4.toFixed(1)} ${y4.toFixed(1)} Z" fill="${cols[i]}" stroke="#fff" stroke-width="1.5"/>`;
  }
  const a=180-v/100*180, [nx,ny]=P(a,R-6);
  return `<svg viewBox="0 0 220 112">${s}<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#06302d" stroke-width="3.2" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="#06302d"/></svg>`;
}
